<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AIsle — Demo camera cảm xúc (checkout)</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
  h1{font-size:18px;margin:0}
  p.hint{color:#94a3b8;font-size:13px;margin:0;max-width:480px;text-align:center}
  #stage{position:relative;width:480px;height:360px;background:#000;border-radius:12px;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #status{font:600 13px monospace;color:#38bdf8}
  #result{background:#1e293b;border-radius:10px;padding:16px;width:480px;box-sizing:border-box}
  #dominant{font-size:24px;font-weight:800;margin:0 0 10px}
  .bar-row{display:flex;align-items:center;gap:8px;font:12px monospace;margin:4px 0}
  .bar-label{width:70px;color:#94a3b8}
  .bar-track{flex:1;height:8px;background:#334155;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;background:#38bdf8}
  .bar-value{width:42px;text-align:right;color:#e2e8f0}
  input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font:12px monospace;width:220px}
</style>
</head>
<body>
<h1>Demo — Camera cảm xúc khách hàng (chỉ thử nghiệm nội bộ)</h1>
<p class="hint">Bật webcam, service Python phân tích cảm xúc gương mặt mỗi ~1.5 giây. Không lưu ảnh nào lên đĩa — chỉ hiển thị kết quả tạm thời trên trang này.</p>
<label>Địa chỉ service: <input id="base-url" value="http://127.0.0.1:8801"></label>
<div id="stage"><video id="video" autoplay playsinline muted></video></div>
<div id="status">Đang chờ bật camera…</div>
<div id="result">
  <p id="dominant">—</p>
  <div id="bars"></div>
</div>

<script>
const EMOTION_LABEL = {angry:'Giận',disgust:'Ghê tởm',fear:'Sợ',happy:'Vui',sad:'Buồn',surprise:'Ngạc nhiên',neutral:'Trung tính'};
const video = document.getElementById('video');
const status = document.getElementById('status');
const dominantEl = document.getElementById('dominant');
const barsEl = document.getElementById('bars');
const baseUrlInput = document.getElementById('base-url');
const canvas = document.createElement('canvas');
canvas.width = 480; canvas.height = 360;
const ctx = canvas.getContext('2d');

let busy = false;

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: {width: 480, height: 360}});
    video.srcObject = stream;
    status.textContent = 'Camera bật — đang phân tích…';
    setInterval(tick, 2200); // CPU inference takes ~1.8s/frame; polling faster than that just wastes skipped ticks
  } catch (error) {
    status.textContent = 'Không mở được camera: ' + error.message;
  }
}

async function tick() {
  if (busy) return;
  busy = true;
  try {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
    const form = new FormData();
    form.append('file', blob, 'frame.jpg');
    const response = await fetch(baseUrlInput.value.replace(/\/$/, '') + '/analyze', {method: 'POST', body: form});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    render(data);
  } catch (error) {
    status.textContent = 'Lỗi: ' + error.message;
  } finally {
    busy = false;
  }
}

function render(data) {
  if (!data.faceCount) {
    status.textContent = 'Không thấy khuôn mặt trong khung hình.';
    dominantEl.textContent = '—';
    barsEl.innerHTML = '';
    return;
  }
  status.textContent = `Phát hiện ${data.faceCount} khuôn mặt.`;
  const face = data.faces[0];
  dominantEl.textContent = EMOTION_LABEL[face.dominantEmotion] || face.dominantEmotion;
  barsEl.innerHTML = Object.entries(face.scores)
    .sort((a, b) => b[1] - a[1])
    .map(([key, value]) => `<div class="bar-row"><span class="bar-label">${EMOTION_LABEL[key] || key}</span><span class="bar-track"><span class="bar-fill" style="width:${value}%"></span></span><span class="bar-value">${value.toFixed(1)}%</span></div>`)
    .join('');
}

start();
</script>
</body>
</html>
